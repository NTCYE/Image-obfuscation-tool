name: Build Android APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
    - name: Prepare Capacitor
      run: |
        mkdir www
        cp index.html www/ || true
        npm init -y
        npm i @capacitor/core @capacitor/cli @capacitor/android
        npx cap init "ImageObfuscationTool" "com.example.imageobfuscation" --web-dir www
        npx cap add android
        npx cap sync
        
        # 修复 Kotlin 依赖冲突（使用 echo 逐行追加，避免 YAML 缩进报错）
        echo "" >> android/build.gradle
        echo "allprojects {" >> android/build.gradle
        echo "    configurations.all {" >> android/build.gradle
        echo "        resolutionStrategy {" >> android/build.gradle
        echo "            force 'org.jetbrains.kotlin:kotlin-stdlib:1.9.22'" >> android/build.gradle
        echo "            force 'org.jetbrains.kotlin:kotlin-stdlib-jdk7:1.9.22'" >> android/build.gradle
        echo "            force 'org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.9.22'" >> android/build.gradle
        echo "        }" >> android/build.gradle
        echo "    }" >> android/build.gradle
        echo "}" >> android/build.gradle
    - name: Build with Gradle
      run: |
        cd android
        chmod +x gradlew
        ./gradlew assembleDebug
    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: app-debug.apk
        path: android/app/build/outputs/apk/debug/app-debug.apk
